name: 清理无效规则

on:
  schedule:
    # 每月1号 UTC 2:00 (北京时间 10:00) 运行
    - cron: '0 2 1 * *'
  workflow_dispatch: # 手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run rule checker
        id: checker
        run: |
          python scripts/rule_checker.py --clean 2>&1 | tee checker.log
          INVALID_COUNT=$(grep -oP '已移除 \K\d+' checker.log || echo "0")
          echo "invalid_count=$INVALID_COUNT" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain sources/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run converter if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          pip install requests
          python converter.py

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          INVALID_COUNT="${{ steps.checker.outputs.invalid_count }}"
          git commit -m "chore: 清理 ${INVALID_COUNT} 条无效域名规则"
          git push

      - name: Send Telegram notification
        if: steps.check.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            INVALID_COUNT="${{ steps.checker.outputs.invalid_count }}"
            MESSAGE="🧹 *规则清理完成*%0A%0A"
            MESSAGE+="🗑️ 已移除 ${INVALID_COUNT} 条无效域名"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${MESSAGE}" \
              -d parse_mode="Markdown"
          fi
