name: Update Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources/*.txt'
      - 'converter.py'
  schedule:
    - cron: '23 0 * * 1,3,5' # 每周一、三、五北京时间 08:23

concurrency:
  group: update-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Check allowlist and source failure handling
        run: python -m unittest discover -s scripts -p test_update_rules.py

      - name: Run converter script
        id: converter
        run: python converter.py

      - name: Commit and Push changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- Loon/*.list QuantumultX/*.list stats.json failed_sources.txt
          if ! git diff --staged --quiet; then
            SUMMARY="${{ steps.converter.outputs.summary }}"
            if [ -z "$SUMMARY" ]; then
              SUMMARY="自动更新规则"
            fi
            git commit -m "feat(rules): $SUMMARY"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected and pushed to the repository."
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes in final rules. Nothing to push."
          fi

      - name: Send Telegram notification (Success)
        if: success() && steps.commit.outputs.changes == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            LOON_AD_COUNT="${{ steps.converter.outputs.loon_ad_count }}"
            LOON_DIRECT_COUNT="${{ steps.converter.outputs.loon_direct_count }}"
            QX_AD_COUNT="${{ steps.converter.outputs.qx_ad_count }}"
            QX_DIRECT_COUNT="${{ steps.converter.outputs.qx_direct_count }}"
            DEDUP_COUNT="${{ steps.converter.outputs.dedup_count }}"

            MESSAGE="✅ 规则更新成功%0A%0A"
            MESSAGE+="📊 统计:%0A"
            MESSAGE+="  • Loon 规则: ad-rules: ${LOON_AD_COUNT} 条    direct-rules: ${LOON_DIRECT_COUNT} 条%0A"
            MESSAGE+="  • QuantumultX 规则: ad-rules: ${QX_AD_COUNT} 条    direct-rules: ${QX_DIRECT_COUNT} 条%0A"
            MESSAGE+="🔄 去重: ${DEDUP_COUNT} 条"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${MESSAGE}" \
              -d parse_mode="HTML"
          fi

      - name: Send Telegram notification (Failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE="❌ *规则更新失败*%0A%0A"
            MESSAGE+="🔗 [查看日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${MESSAGE}" \
              -d parse_mode="Markdown"
          fi
