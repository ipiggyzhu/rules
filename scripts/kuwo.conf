#!name=酷我音乐
#!desc=解锁会员权限、支持切换音质 (Quantumult X 版)
#!author=ONZV & 89996462 (QX转换版)
#!homepage=https://github.com/Yuheng0101/X
#!date=2026-01-27

# ==============================
# Quantumult X 配置片段
# 酷我测试版本 -> 12.0.6
# ==============================
# 使用方法:
# 1. 将 [rewrite_local] 内容添加到 QX 配置对应段落
# 2. 将 [mitm] 的 hostname 添加到 QX 配置
# 3. 或者作为引用配置使用
# ==============================
# 重要提示:
# - 图片域名已排除，确保封面正常显示
# - 如果音乐无法播放，可能是音源服务失效
# ==============================

[rewrite_local]
# ============ 广告拦截 ============
# 开屏广告、横幅广告等
^https?:\/\/mobilead\.kuwo\.cn\/EcomResourceServer\/(getIOSIsHideAd|getMotor)\.do url reject-dict
^https?:\/\/rich\.kuwo\.cn\/(AdService|ecom)\/kaiping\/ad[iI]nfo url reject-dict
^https?:\/\/wapi\.kuwo\.cn\/openapi\/v1\/user\/adVip\/info url reject-dict
^https?:\/\/wapi\.kuwo\.cn\/openapi\/v1\/operate(\/adVip|\/freeMode\/h5)?\/text url reject-dict
^https?:\/\/ad\.tencentmusic\.com\/config\/uni url reject-dict
^https?:\/\/abt-kuwo\.tencentmusic\.com\/kuwo\/ui\/info url reject-dict

# ============ 酷我音乐解锁 (本地备份脚本) ============
# 原始来源: https://github.com/Yuheng0101/X
^https?:\/\/vip1\.kuwo\.cn\/vip\/v2\/user\/vip url script-response-body https://raw.githubusercontent.com/ipiggyzhu/rules/main/scripts/kuwo/kuwo.js
^https?:\/\/vip1\.kuwo\.cn\/vip\/enc\/user\/vip url script-response-body https://raw.githubusercontent.com/ipiggyzhu/rules/main/scripts/kuwo/kuwo.js
^https?:\/\/musicpay\.kuwo\.cn\/music\.pay\?newver=3 url script-request-body https://raw.githubusercontent.com/ipiggyzhu/rules/main/scripts/kuwo/kuwo.js
^https?:\/\/music\.kuwo\.cn\/music\.pay\?newver=3 url script-request-body https://raw.githubusercontent.com/ipiggyzhu/rules/main/scripts/kuwo/kuwo.js
^https?:\/\/.+\.kuwo\.cn\/mobi\.s\?f=kwxs&q= url script-response-body https://raw.githubusercontent.com/ipiggyzhu/rules/main/scripts/kuwo/kuwo.js

# ============ 备用: 社区维护脚本 ============
# 原始来源: https://github.com/89996462/Quantumult-X
# ^https?:\/\/vip1\.kuwo\.cn\/vip\/v2\/user\/vip url script-response-body https://raw.githubusercontent.com/ipiggyzhu/rules/main/scripts/kuwo/kwyy.js
# ^https?:\/\/vip1\.kuwo\.cn\/vip\/enc\/user\/vip url script-response-body https://raw.githubusercontent.com/ipiggyzhu/rules/main/scripts/kuwo/kwyy.js

[mitm]
# 注意: 排除图片服务器域名，避免封面无法加载
# 使用 - 前缀排除域名
hostname = mobilead.kuwo.cn, rich.kuwo.cn, wapi.kuwo.cn, vip1.kuwo.cn, homepages.kuwo.cn, music.kuwo.cn, musicpay.kuwo.cn, tingshu.kuwo.cn, audiobookpay.kuwo.cn, mobi.kuwo.cn, nmobi.kuwo.cn, ad.tencentmusic.com, abt-kuwo.tencentmusic.com

# 以下域名不要添加到 MITM，否则图片无法加载:
# - img*.kuwo.cn (图片CDN)
# - star.kuwo.cn (明星图片)
# - kwimg*.kuwo.cn (封面图片)
# - artistpicserver.kuwo.cn (歌手图片)
